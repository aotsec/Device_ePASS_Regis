<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนอุปกรณ์อิเล็กทรอนิกส์ ทสภ.</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 15px; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
    h2 { color: #003366; text-align: center; margin-bottom: 20px; font-size: 20px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    .item-block { border: 1px dashed #0056b3; padding: 15px; border-radius: 8px; background: #f0f7ff; margin-bottom: 15px; }
    .btn { background-color: #0056b3; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background-color: #cccccc; cursor: not-allowed; }
    .btn-add { background-color: #28a745; margin-bottom: 15px; }
    .pdpa-box { font-size: 13px; color: #555; background: #eee; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    .img-preview { max-width: 100%; height: 120px; object-fit: contain; margin-top: 5px; display: none; border: 1px solid #ddd; }
    .status-msg { text-align:center; font-size:13px; color:#0056b3; margin-top:8px; min-height:18px; }
    .file-size-hint { font-size:11px; color:#888; margin-top:3px; }
    /* สไตล์สำหรับช่องกรอกข้อมูล "อื่นๆ" */
    .other-input { width: 100%; padding: 10px; border: 1px dashed #ff9900; border-radius: 6px; margin-top: 8px; box-sizing: border-box; font-size: 14px; background-color: #fff9f0; }
  </style>
</head>
<body>

<div class="card">
  <h2>ลงทะเบียน / อัปเดตข้อมูลอุปกรณ์ ทสภ.</h2>
  <form id="regForm">

    <div class="form-group">
      <label>แนบรูปหน้าบัตรอนุญาตบุคคล *</label>
      <input type="file" id="cardImg" accept="image/*" onchange="previewImage(this, 'cardImgPreview')">
      <img id="cardImgPreview" class="img-preview">
      <div class="file-size-hint">ระบบจะบีบอัดรูปให้อัตโนมัติเพื่อความเร็วในการส่งข้อมูล</div>
    </div>

    <div class="form-group">
      <label>หมายเลขบัตรอนุญาตบุคคล *</label>
      <input type="text" id="cardNumber" required placeholder="กรอกหมายเลขบัตรอนุญาต">
    </div>

    <div class="form-group">
      <label>คำนำหน้าชื่อ *</label>
      <select id="title" required onchange="handleDropdownChange(this)"><option value="">-- กำลังโหลดรายการ --</option></select>
    </div>

    <div class="form-group">
      <label>ชื่อ * (ไม่มีคำนำหน้านาม)</label>
      <input type="text" id="firstName" required placeholder="ชื่อจริง">
    </div>

    <div class="form-group">
      <label>นามสกุล *</label>
      <input type="text" id="lastName" required placeholder="นามสกุล">
    </div>

    <div class="form-group">
      <label>อีเมล (E-Mail) *</label>
      <input type="email" id="email" required placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label>บริษัท *</label>
      <input type="text" id="company" required placeholder="ระบุชื่อบริษัท/หน่วยงาน">
    </div>

    <div class="form-group">
      <label>หน้าที่ หรือ สังกัด *</label>
      <input type="text" id="role" required placeholder="ระบุหน้าที่ หรือสังกัด">
    </div>

    <div class="form-group">
      <label>หมายเลขโทรศัพท์ (10 หลัก) *</label>
      <input type="tel" id="phone" pattern="[0-9]{10}" maxlength="10" required placeholder="08XXXXXXXX">
    </div>

    <hr style="margin: 20px 0;">
    <h3 style="font-size:16px; color:#003366;">รายการลงทะเบียนอุปกรณ์ (สูงสุด 5 รายการ)</h3>

    <div id="itemsContainer"></div>

    <button type="button" id="btnAddItem" class="btn btn-add" onclick="addItem()">+ เพิ่มรายการอุปกรณ์</button>

    <div class="pdpa-box">
      <input type="checkbox" id="pdpa" required style="width: auto;">
      <label for="pdpa" style="display:inline; font-weight:normal;">
        ข้าพเจ้ายินยอมให้ใช้ข้อมูลเพื่อการตรวจสอบตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล (PDPA) และรับทราบว่าจะปฏิบัติตามข้อกำหนดและมาตรการรักษาความปลอดภัยของ ทสภ. อย่างเคร่งครัด
      </label>
    </div>

    <button type="submit" id="btnSubmit" class="btn">บันทึกข้อมูลลงทะเบียน</button>
    <div id="statusMsg" class="status-msg"></div>
  </form>
</div>

<script>
  let lineUserId = '';
  let itemIndex = 0;
  let configData = {};
  let existingCardImgUrl = '-';
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBQMTMg3GUKXyXFvPluE-BK7ZFJ94B_jYoxPKF8KRN5FgocQ7amPAN0UX9cqIjSJcI/exec";

  const IMG_MAX_DIMENSION = 1280;
  const IMG_TARGET_KB = 400;
  const FETCH_TIMEOUT_MS = 45000;

  function setStatus(msg) {
    document.getElementById('statusMsg').innerText = msg || '';
  }

  // สร้าง Text Box เมื่อเลือก "อื่นๆ"
  function handleDropdownChange(selectElement) {
    let nextSibling = selectElement.nextElementSibling;
    if (selectElement.value === 'อื่นๆ') {
      if (!nextSibling || !nextSibling.classList.contains('other-input')) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'other-input';
        input.placeholder = 'โปรดระบุข้อมูล...';
        input.required = true;
        selectElement.parentNode.insertBefore(input, selectElement.nextSibling);
      }
    } else {
      if (nextSibling && nextSibling.classList.contains('other-input')) {
        nextSibling.remove();
      }
    }
  }

  // ดึงค่าจริง (ถ้าเป็นอื่นๆ ให้ดึงจาก Text Box แทน)
  function getActualValue(selectElement) {
    if (!selectElement) return "";
    if (selectElement.value === 'อื่นๆ') {
      return selectElement.nextElementSibling ? selectElement.nextElementSibling.value.trim() : 'อื่นๆ';
    }
    return selectElement.value;
  }

  function fetchJSONP(url, callbackName) {
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        reject(new Error("หมดเวลาเชื่อมต่อ (JSONP timeout)"));
        cleanup();
      }, 15000);
      function cleanup() {
        if (document.body.contains(script)) document.body.removeChild(script);
        delete window[callbackName];
        clearTimeout(timer);
      }
      window[callbackName] = function(data) {
        resolve(data);
        cleanup();
      };
      script.src = `${url}&callback=${callbackName}`;
      script.onerror = () => { reject(new Error("JSONP Request Failed")); cleanup(); };
      document.body.appendChild(script);
    });
  }

  window.onload = async function() {
    await fetchConfig();
    liff.init({ liffId: "2011647032-x6HiAaYa" }).then(async () => {
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        lineUserId = profile.userId;
        await fetchUserData(lineUserId);
      } else {
        liff.login();
      }
    }).catch(err => {
      console.error("LIFF init error:", err);
      if (itemIndex === 0) addItem();
    });
  };

  async function fetchConfig() {
    try {
      const data = await fetchJSONP(`${GAS_WEB_APP_URL}?action=getConfig`, 'handleConfigResponse');
      if (data.status === "success") {
        configData = data.config;
        populateDropdown('title', configData.titles);
      }
    } catch (err) {
      console.error("Fetch Config Error:", err);
      setStatus("โหลดรายการตัวเลือกไม่สำเร็จ กรุณารีเฟรชหน้าใหม่");
    }
  }

  async function fetchUserData(userId) {
    try {
      const data = await fetchJSONP(`${GAS_WEB_APP_URL}?action=getUserData&lineUserId=${userId}`, 'handleUserResponse');
      if (data.status === "found") {
        const user = data.userData;
        document.getElementById('cardNumber').value = user.cardNumber || '';
        document.getElementById('title').value = user.title || '';
        document.getElementById('firstName').value = user.firstName || '';
        document.getElementById('lastName').value = user.lastName || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('company').value = user.company || '';
        document.getElementById('role').value = user.role || '';
        document.getElementById('phone').value = user.phone || '';
        existingCardImgUrl = user.cardImgUrl || '-';

        if (existingCardImgUrl !== '-') {
          const imgPrev = document.getElementById('cardImgPreview');
          imgPrev.src = existingCardImgUrl;
          imgPrev.style.display = 'block';
        }
      }
    } catch (err) { console.error("Fetch User Error:", err); }
    if (itemIndex === 0) addItem();
  }

  function populateDropdown(elemId, optionsList) {
    const select = document.getElementById(elemId);
    select.innerHTML = '<option value="">-- เลือกรายการ --</option>';
    if (optionsList) {
      optionsList.forEach(opt => {
        select.innerHTML += `<option value="${opt}">${opt}</option>`;
      });
    }
  }

  function addItem() {
    if (itemIndex >= 5) return alert("ลงทะเบียนได้สูงสุด 5 รายการเท่านั้นค่ะ");
    itemIndex++;
    const container = document.getElementById('itemsContainer');
    const div = document.createElement('div');
    div.className = 'item-block';
    div.id = `item_${itemIndex}`;

    let types = (itemIndex === 1)
      ? (configData.deviceTypes || []).filter(t => t.includes("โทรศัพท์") || t.includes("แท็บเล็ต") || t.includes("iPad"))
      : (configData.deviceTypes || []);

    let typeOpts = types.map(t => `<option value="${t}">${t}</option>`).join('');
    let brandOpts = (configData.brands || []).map(b => `<option value="${b}">${b}</option>`).join('');
    let colorOpts = (configData.colors || []).map(c => `<option value="${c}">${c}</option>`).join('');

    // ควบคุมการแสดงผลช่องแนบรูป (รายการ 1 ไม่ต้องมีรูป, รายการ 2-5 มีรูป)
    let imageSectionHTML = '';
    if (itemIndex > 1) {
      imageSectionHTML = `
        <div class="form-group">
          <label>6. ถ่ายรูปอุปกรณ์ (ถ้ามี)</label>
          <input type="file" class="item-img" accept="image/*" onchange="previewImage(this, 'itemImgPrev_${itemIndex}')">
          <img id="itemImgPrev_${itemIndex}" class="img-preview">
        </div>
      `;
    } else {
      imageSectionHTML = `<div style="font-size: 13px; color: #d9534f; margin-bottom: 15px;">* รายการที่ 1 ไม่ต้องแนบรูปถ่ายอุปกรณ์</div>`;
    }

    div.innerHTML = `
      <h4 style="margin-top:0;">รายการที่ ${itemIndex}</h4>
      <div class="form-group"><label>1. ประเภทอุปกรณ์ *</label><select class="item-type" required onchange="handleDropdownChange(this)"><option value="">-- เลือกประเภท --</option>${typeOpts}</select></div>
      <div class="form-group"><label>2. ยี่ห้อ *</label><select class="item-brand" required onchange="handleDropdownChange(this)"><option value="">-- เลือกรุ่น/ยี่ห้อ --</option>${brandOpts}</select></div>
      <div class="form-group"><label>3. ระบุรุ่น / โมเดล *</label><input type="text" class="item-model" required placeholder="รุ่น / โมเดล"></div>
      <div class="form-group"><label>4. หมายเลขซีเรียล (S/N) หรือ IMEI *</label><input type="text" class="item-serial" required placeholder="S/N หรือ IMEI"></div>
      <div class="form-group"><label>5. สีของอุปกรณ์ *</label><select class="item-color" required onchange="handleDropdownChange(this)"><option value="">-- เลือกสี --</option>${colorOpts}</select></div>
      ${imageSectionHTML}
    `;
    container.appendChild(div);
    if (itemIndex === 5) document.getElementById('btnAddItem').style.display = 'none';
  }

  function previewImage(input, previewId) {
    const preview = document.getElementById(previewId);
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function drawToDataUrl(img, quality) {
    let { width, height } = img;
    if (width > IMG_MAX_DIMENSION || height > IMG_MAX_DIMENSION) {
      const ratio = Math.min(IMG_MAX_DIMENSION / width, IMG_MAX_DIMENSION / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  async function compressImageFile(file) {
    if (!file) return null;
    try {
      const img = await loadImageFromFile(file);
      let quality = 0.8;
      let dataUrl = drawToDataUrl(img, quality);
      let sizeKB = (dataUrl.length * 0.75) / 1024;
      while (sizeKB > IMG_TARGET_KB && quality > 0.3) {
        quality -= 0.1;
        dataUrl = drawToDataUrl(img, quality);
        sizeKB = (dataUrl.length * 0.75) / 1024;
      }
      return dataUrl;
    } catch (err) { return await getBase64Raw(file); }
  }

  function getBase64Raw(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
    });
  }

  function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    return fetch(url, { ...options, signal: controller.signal })
      .finally(() => clearTimeout(timer));
  }

  document.getElementById('regForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitBtn = document.getElementById('btnSubmit');
    submitBtn.disabled = true;

    try {
      setStatus("กำลังเตรียมรูปหน้าบัตร...");
      const cardImgFile = document.getElementById('cardImg').files[0];
      const cardImgBase64 = cardImgFile ? await compressImageFile(cardImgFile) : null;

      const items = [];
      for (let i = 1; i <= itemIndex; i++) {
        const block = document.getElementById(`item_${i}`);
        if (block) {
          const typeSelect = block.querySelector('.item-type');
          const brandSelect = block.querySelector('.item-brand');
          const colorSelect = block.querySelector('.item-color');
          
          let itemImgBase64 = null;
          const imgInput = block.querySelector('.item-img');
          if (imgInput && imgInput.files[0]) {
            setStatus(`กำลังเตรียมรูปอุปกรณ์รายการที่ ${i}...`);
            itemImgBase64 = await compressImageFile(imgInput.files[0]);
          }

          items.push({
            type: getActualValue(typeSelect),
            brand: getActualValue(brandSelect),
            model: block.querySelector('.item-model').value.trim(),
            serial: block.querySelector('.item-serial').value.trim(),
            color: getActualValue(colorSelect),
            imgBase64: itemImgBase64
          });
        }
      }

      const payload = {
        lineUserId: lineUserId,
        cardNumber: document.getElementById('cardNumber').value.trim(),
        title: getActualValue(document.getElementById('title')),
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        company: document.getElementById('company').value.trim(),
        role: document.getElementById('role').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        cardImgBase64: cardImgBase64,
        existingCardImgUrl: existingCardImgUrl,
        items: items,
        pdpaAccepted: document.getElementById('pdpa').checked
      };

      const payloadStr = JSON.stringify(payload);
      if (payloadStr.length > 15 * 1024 * 1024) {
        throw new Error(`ขนาดข้อมูลใหญ่เกินไป กรุณาลดจำนวนรูปภาพ หรือถ่ายรูปใหม่`);
      }

      setStatus("กำลังส่งข้อมูล กรุณารอสักครู่...");
      submitBtn.innerText = "กำลังบันทึก...";

      const res = await fetchWithTimeout(GAS_WEB_APP_URL, {
        method: 'POST',
        body: payloadStr,
        redirect: 'follow'
      }, FETCH_TIMEOUT_MS);

      if (!res.ok) throw new Error(`เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${res.status})`);
      const data = await res.json();

      if (data.status === "success") {
        setStatus("");
        alert("บันทึกข้อมูลเรียบร้อยแล้วค่ะ!");

        // ฟีเจอร์ใหม่: รีเซ็ตฟอร์มและเคลียร์หน้าจอทั้งหมดเตรียมพร้อมสำหรับรายการต่อไป
        document.getElementById('regForm').reset();
        document.getElementById('cardImgPreview').style.display = 'none';
        document.getElementById('cardImgPreview').src = '';
        document.getElementById('itemsContainer').innerHTML = ''; 
        document.getElementById('btnAddItem').style.display = 'block';
        itemIndex = 0;
        addItem(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });

      } else {
        throw new Error(data.message || "ไม่ทราบสาเหตุ");
      }

    } catch (err) {
      console.error("Submit Error:", err);
      let userMsg = err.message || err.toString();
      if (err.name === 'AbortError') userMsg = "หมดเวลาเชื่อมต่อ เครือข่ายอาจช้าหรือไม่เสถียร กรุณาลองใหม่อีกครั้ง";
      setStatus("");
      alert("เกิดข้อผิดพลาด: " + userMsg);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "บันทึกข้อมูลลงทะเบียน";
    }
  });
</script>

</body>
</html>
